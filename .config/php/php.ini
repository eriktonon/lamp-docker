; =============================================================================
; Hardened PHP 8.4 Runtime Configuration (Build-to-Manage & Strix AppSec)
; Repository: https://github.com/eriktonon/lamp-docker
; =============================================================================

[PHP]
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
zlib.output_compression = Off
implicit_flush = Off
serialize_precision = -1
zend.enable_gc = On
zend.exception_ignore_args = On
zend.exception_string_param_max_len = 0

; --- Security & Information Disclosure Hardening (OWASP A05 / CWE-200) ---
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
log_errors_max_len = 2048
ignore_repeated_errors = Off
ignore_repeated_source = Off
report_memleaks = On
html_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
allow_url_fopen = On
allow_url_include = Off
enable_dl = Off
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec

; --- Resource & Upload Quotas ---
max_execution_time = 30
max_input_time = 60
max_input_vars = 1000
memory_limit = 256M
post_max_size = 16M
file_uploads = On
upload_max_filesize = 16M
max_file_uploads = 20

; --- Charset & Localization (Brazil Enterprise Standard) ---
default_mimetype = "text/html"
default_charset = "UTF-8"

[Date]
date.timezone = "America/Sao_Paulo"

[Intl]
intl.default_locale = "pt_BR.UTF-8"

[Session]
session.save_handler = files
session.use_strict_mode = 1
session.use_cookies = 1
session.use_only_cookies = 1
session.name = "__Host_LAMPSESSID"
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.sid_length = 48
session.sid_bits_per_character = 6

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.jit = 1255
opcache.jit_buffer_size = 64M
